name: ios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only read access is needed: no signing secrets, no releases, no deploys.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: analyze, test, build iOS
    # Pinned instead of macos-latest on purpose: this image ships Xcode 16.4 as
    # the default toolchain, and macOS 26 images are a moving target.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build iOS for a device without signing
        # Code signing is disabled hard for this step: there are no certificates
        # and no secrets in this workflow, so any attempt to sign must fail loudly
        # rather than silently pick something up from the runner.
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""
        run: flutter build ios --release --no-codesign

      - name: Export an unsigned .ipa from the archive
        # This is the only step whose behaviour varies with the Flutter/Xcode
        # versions, so it is allowed to warn instead of failing the release
        # build; the .xcarchive below is uploaded either way.
        continue-on-error: true
        run: |
          set -euo pipefail
          ARCHIVE="build/ios/archive/Runner.xcarchive"
          test -d "$ARCHIVE"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string></string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          mkdir -p build/ios/unsigned-ipa
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/unsigned-ipa

      - name: Check what was produced
        if: always()
        run: |
          set -euo pipefail
          echo "--- ios build tree ---"
          find build/ios -maxdepth 2 -print 2>/dev/null || true
          du -sh build/ios 2>/dev/null || true

      - name: Upload unsigned archive and .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ios/archive/Runner.xcarchive
            build/ios/ipa/*.ipa
            build/ios/unsigned-ipa/*.ipa

  build-simulator:
    name: build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 40
    needs: build-ios

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build simulator app
        run: flutter build ios --debug --simulator --no-codesign

      - name: Report the produced app bundle
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          test -d "$APP"
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          if-no-files-found: error
          retention-days: 14
          path: build/ios/iphonesimulator/Runner.app
