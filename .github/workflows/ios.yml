name: ios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only read access is needed: no signing secrets, no releases, no deploys.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: analyze, test, build iOS
    # Pinned instead of macos-latest on purpose: this image ships Xcode 16.4 as
    # the default toolchain, and macOS 26 images are a moving target.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build iOS release archive without signing
        # `flutter build ipa --no-codesign` produces build/ios/archive/Runner.xcarchive
        # and deliberately skips the .ipa step, which needs signing.
        #
        # Signing is not configured anywhere in this workflow: there are no
        # certificates and no secrets. Flutter passes CODE_SIGNING_ALLOWED=NO,
        # CODE_SIGNING_REQUIRED=NO and CODE_SIGNING_IDENTITY="" to xcodebuild
        # itself, and the verification step below asserts the bundle stayed
        # unsigned, so an accidental signing pass would fail loudly.
        run: flutter build ipa --release --no-codesign

      - name: Verify the archive exists and is well formed
        run: |
          set -euo pipefail
          ARCHIVE="build/ios/archive/Runner.xcarchive"
          test -d "$ARCHIVE"
          du -sh "$ARCHIVE"
          test -f "$ARCHIVE/Info.plist"
          APP="$ARCHIVE/Products/Applications/Runner.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          codesign -dv "$APP" 2>&1 || echo "expected: bundle is unsigned"

      - name: Package an unsigned .ipa from the archive
        # Flutter skips its own .ipa step under --no-codesign because
        # `xcodebuild -exportArchive` requires a signing identity, so the IPA is
        # assembled here instead. An IPA is a zip with Payload/<App>.app at the
        # root; repacking an already-built app bundle needs neither xcodebuild
        # nor any certificate.
        #
        # The result is a genuine, structurally valid IPA whose code is not
        # signed: it is input for a signing step (codesign + a provisioning
        # profile), not something iOS will install as-is. That is asserted below
        # with `unzip -t` plus a check that the app bundle carries no signature.
        run: |
          set -euo pipefail
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP"

          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          # -a preserves permissions and extended attributes, which a re-signing
          # step relies on.
          cp -a "$APP" "$STAGE/Payload/Runner.app"

          mkdir -p build/ios/ipa
          rm -f build/ios/ipa/Runner-unsigned.ipa
          ( cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/Runner-unsigned.ipa" Payload )

          IPA="build/ios/ipa/Runner-unsigned.ipa"
          du -sh "$IPA"
          unzip -t "$IPA" >/dev/null
          echo "IPA structure:"
          unzip -l "$IPA" | head -5

          # Only the root app bundle must be unsigned. The nested engine
          # frameworks keep Apple's own signatures, which is how the Flutter
          # engine ships and is not something this workflow controls.
          test -f "$STAGE/Payload/Runner.app/Info.plist"
          if [ -d "$STAGE/Payload/Runner.app/_CodeSignature" ]; then
            echo "::error::Runner.app unexpectedly carries a signature"
            exit 1
          fi
          if [ -f "$STAGE/Payload/Runner.app/embedded.mobileprovision" ]; then
            echo "::error::Runner.app unexpectedly carries a provisioning profile"
            exit 1
          fi
          echo "confirmed: Payload/Runner.app is present and unsigned"

      - name: Upload the unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          if-no-files-found: error
          retention-days: 14
          path: build/ios/archive/Runner.xcarchive

      - name: Upload the unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          if-no-files-found: error
          retention-days: 14
          path: build/ios/ipa/Runner-unsigned.ipa

  build-simulator:
    name: build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 40
    needs: build-ios

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build simulator app
        run: flutter build ios --debug --simulator --no-codesign

      - name: Report the produced app bundle
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          test -d "$APP"
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          if-no-files-found: error
          retention-days: 14
          path: build/ios/iphonesimulator/Runner.app
