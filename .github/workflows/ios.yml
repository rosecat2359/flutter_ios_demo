name: ios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only read access is needed: no signing secrets, no releases, no deploys.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: analyze, test, build iOS
    # Pinned instead of macos-latest on purpose: this image ships Xcode 16.4 as
    # the default toolchain, and macOS 26 images are a moving target.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build iOS release archive without signing
        # `flutter build ipa --no-codesign` produces build/ios/archive/Runner.xcarchive
        # and deliberately skips the .ipa step, which needs signing. There are no
        # certificates and no secrets in this workflow, so signing is disabled hard:
        # any attempt to sign must fail loudly instead of picking something up from
        # the runner.
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""
        run: flutter build ipa --release --no-codesign

      - name: Verify the archive exists and is well formed
        run: |
          set -euo pipefail
          ARCHIVE="build/ios/archive/Runner.xcarchive"
          test -d "$ARCHIVE"
          du -sh "$ARCHIVE"
          test -f "$ARCHIVE/Info.plist"
          APP="$ARCHIVE/Products/Applications/Runner.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          codesign -dv "$APP" 2>&1 || echo "expected: bundle is unsigned"

      - name: Upload the unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          if-no-files-found: error
          retention-days: 14
          path: build/ios/archive/Runner.xcarchive

  build-simulator:
    name: build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 40
    needs: build-ios

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build simulator app
        run: flutter build ios --debug --simulator --no-codesign

      - name: Report the produced app bundle
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          test -d "$APP"
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          if-no-files-found: error
          retention-days: 14
          path: build/ios/iphonesimulator/Runner.app
